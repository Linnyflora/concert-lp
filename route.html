<title>道案内（金山駅→名古屋市音楽プラザ）</title>

<style>
  :root{--paper:#fdf8f2;--ink:#3a332e;--ink-soft:#7a7067;--label:#9b9188;
    --line:#e6ddd2;--rose:#e2867f;--rose-d:#c4615a;
    --maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","YuGothic","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#555;font-family:var(--maru);color:var(--ink);-webkit-font-smoothing:antialiased}
  .stage{width:1080px;height:1920px;position:relative;background:var(--paper);overflow:hidden;margin:0 auto}

  .deco{position:absolute;color:var(--rose);height:auto}
  .e1{top:300px;right:110px;width:44px;opacity:.85;transform:rotate(-12deg)}
  .e2{top:392px;right:188px;width:26px;opacity:.55;transform:rotate(16deg)}
  .e3{bottom:470px;left:104px;width:34px;opacity:.7;transform:rotate(-8deg)}

  .hdr{position:absolute;top:104px;left:0;right:0;text-align:center}
  .hdr .k{margin:0;font-size:28px;letter-spacing:.34em;text-indent:.34em;color:var(--label)}
  .hdr .v{margin:14px 0 0;font-size:52px;font-weight:700}
  .hdr .s{margin:12px 0 0;font-size:31px;color:var(--ink-soft)}

  .mapwrap{position:absolute;top:404px;left:80px;width:920px;height:730px;overflow:hidden;opacity:0;border-radius:18px}
  .cam{position:absolute;top:0;left:0;width:920px;transform-origin:0 0}
  .mapwrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,var(--paper) 0,rgba(253,248,242,0) 78px),linear-gradient(to left,var(--paper) 0,rgba(253,248,242,0) 78px),linear-gradient(to bottom,var(--paper) 0,rgba(253,248,242,0) 46px),linear-gradient(to top,var(--paper) 0,rgba(253,248,242,0) 46px)}

  .map { display:block; width:100%; height:auto; color:var(--ink); }
  .map text { font-family:var(--maru); fill:var(--ink); }
  .t-n      { font-size:25px; font-weight:700; fill:var(--ink-soft); }
  .t-band   { font-size:21px; fill:var(--ink-soft); letter-spacing:.08em; }
  .t-box-b  { font-size:27px; font-weight:700; }
  .t-box-s  { font-size:22px; fill:var(--ink-soft); }
  .t-stn    { font-size:30px; font-weight:700; }
  .t-exit   { font-size:20px; font-weight:700; }
  .t-exit-l { font-size:23px; font-weight:700; fill:var(--rose-d); }
  .t-walk   { font-size:23px; font-weight:700; fill:var(--rose-d); }
  .map .goal rect   { stroke:var(--rose); }
  .map .goal .t-box-b { fill:var(--rose-d); }
  .map .route, .map .arrow { stroke:var(--rose); }
  .map .walker { color:var(--ink); }

  .map .arrow{opacity:0}
  .map .exit circle{transform-box:fill-box;transform-origin:center}
  .map .walker{transition:none}

  .cap{position:absolute;left:80px;right:80px;top:1240px;text-align:center}
  .cap .no{margin:0 0 18px;font-size:34px;font-weight:700;color:var(--rose-d);letter-spacing:.2em}
  .cap .tx{margin:0;font-size:52px;font-weight:700;line-height:1.5}
  .cap .sub{margin:16px 0 0;font-size:31px;color:var(--ink-soft);line-height:1.5}

  .foot{position:absolute;left:80px;right:80px;bottom:132px;text-align:center;opacity:0}
  .foot .d{margin:0;font-size:60px;font-weight:700}
  .foot .t{margin:10px 0 0;font-size:36px}
  .foot .f{margin:22px 0 0;font-size:40px;font-weight:700;color:var(--rose-d)}
  .rib{position:absolute;left:0;bottom:36px;width:100%;height:auto;color:var(--rose);opacity:.8}

  .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--paper);text-align:center;padding:0 90px}
  .title .k{margin:0 0 26px;font-size:30px;letter-spacing:.34em;text-indent:.34em;color:var(--label)}
  .title .m{margin:0;font-size:82px;font-weight:700;line-height:1.42}
  .title .n{margin:34px 0 0;font-size:46px;font-weight:700;color:var(--rose-d)}
  .title .s{margin:20px 0 0;font-size:32px;color:var(--ink-soft)}
  .title .g{width:210px;margin:40px auto 0}
  .title .g img{width:100%;height:auto;display:block}
</style>
</head>

<script>
(function(){
  var reveal = document.querySelector('.rvpath');
  var route  = document.querySelector('.map .route');
  var arrow  = document.querySelector('.map .arrow');
  var walker = document.querySelector('.map .walker');
  var L = reveal.getTotalLength();
  reveal.style.strokeDasharray = L + ' ' + L;

  var STEPS = [
    {t0:2.6, no:'STEP 1', tx:'地下鉄「金山」駅<br>⑥出口を出ます', sub:'名城線・名港線', p0:0, p1:0},
    {t0:5.0, no:'STEP 2', tx:'地下連絡通路を通って<br>市民会館の方へ', sub:'市民会館へつながる地下連絡通路があります', p0:0, p1:0.467},
    {t0:7.6, no:'STEP 3', tx:'北へ進むと<br>名古屋市音楽プラザ', sub:'⑥出口から徒歩約3分', p0:0.467, p1:1},
    {t0:10.2,no:'GOAL',   tx:'1階 音楽サロン', sub:'どなた様も出入り自由です', p0:1, p1:1}
  ];
  var END = 14.0;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}

  window.seek = function(t){
    var title=document.getElementById('title');
    title.style.opacity = t<2.2 ? 1 : clamp(1-(t-2.2)/0.4,0,1);
    title.style.display = t<2.65 ? 'flex' : 'none';

    var show = clamp((t-2.4)/0.5,0,1);
    document.getElementById('hdr').style.opacity = show;
    document.getElementById('mapwrap').style.opacity = show;

    var cur=STEPS[0], idx=0;
    for (var i=0;i<STEPS.length;i++){ if(t>=STEPS[i].t0){cur=STEPS[i]; idx=i;} }
    var next = STEPS[idx+1];
    var span = (next? next.t0 : END) - cur.t0;
    var local = clamp((t-cur.t0)/Math.max(span-0.6,0.1),0,1);
    var p = cur.p0 + (cur.p1-cur.p0)*ease(local);

    reveal.style.strokeDashoffset = L*(1-p);
    arrow.style.opacity = p>=0.999 ? 1 : 0;

    // 女の子を経路上で歩かせる（上下に小さく弾ませる）
    var pt = route.getPointAtLength(route.getTotalLength()*p);
    var moving = (p>cur.p0+0.001 && p<cur.p1-0.001);
    var bob = moving ? Math.abs(Math.sin(t*7))*3.2 : 0;
    var s = 1.7;
    // ゴール後は会場の箱の上に立って待っている
    var gx = pt.x, gy = pt.y;
    if (t > 10.3) {
      var q = ease(clamp((t-10.3)/1.0,0,1));
      gx = pt.x + (198-pt.x)*q;
      gy = pt.y + (120-pt.y)*q;
      bob = Math.abs(Math.sin(t*4))*2.2*q;
    }
    walker.setAttribute('transform','translate('+(gx-20*s)+' '+(gy-56*s-bob)+') scale('+s+')');

    document.getElementById('capno').innerHTML  = cur.no;
    document.getElementById('captx').innerHTML  = cur.tx;
    document.getElementById('capsub').innerHTML = cur.sub;
    document.getElementById('cap').style.opacity = show*clamp((t-cur.t0)/0.35,0,1);

      // カメラ：歩いているあいだ女の子に寄って追いかける
    var cam = document.getElementById('cam');
    var S = 920/640, VBX = 0, VBY = 18, VW = 920, VH = 730.25;
    var ZOOM = 1.7, IN0 = 2.9, IN1 = 3.9, OUT0 = 11.2, OUT1 = 12.3;
    var k = 1;
    if (t > IN0 && t <= IN1)       k = 1 + (ZOOM-1)*ease(clamp((t-IN0)/(IN1-IN0),0,1));
    else if (t > IN1 && t <= OUT0) k = ZOOM;
    else if (t > OUT0)             k = ZOOM - (ZOOM-1)*ease(clamp((t-OUT0)/(OUT1-OUT0),0,1));
    // 女の子と「この区間のゴール」の中間を見る＝進む先が画面に入る
    var lead = route.getPointAtLength(route.getTotalLength()*((p+cur.p1)/2));
    var fx = (lead.x - VBX) * S, fy = (lead.y - VBY) * S;
    var tx = clamp(VW/2 - k*fx, VW - k*VW, 0);
    var ty = clamp(VH/2 - k*fy, VH - k*VH, 0);
    cam.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+k+')';

    var ex = document.querySelector('.map .exit circle');
    var pulse = (t>=2.6 && t<5.0) ? 1+0.12*Math.sin((t-2.6)*6) : 1;
    ex.style.transform = 'scale('+pulse+')';
    ex.style.stroke = (t>=2.6 && t<5.0) ? 'var(--rose-d)' : 'currentColor';

    document.getElementById('foot').style.opacity = clamp((t-10.6)/0.6,0,1);
  };
  window.VIDEO_END = END;
  window.seek(0);
})();
</script>
</body>
