<script>
(function(){
  var reveal = document.querySelector('.rvpath');
  var route  = document.querySelector('.map .route');
  var arrow  = document.querySelector('.map .arrow');
  var walker = document.querySelector('.map .walker');
  var L = reveal.getTotalLength();
  reveal.style.strokeDasharray = L + ' ' + L;

  var STEPS = [
    {t0:2.6, no:'STEP 1', tx:'地下鉄「金山」駅<br>⑥出口を出ます', sub:'名城線・名港線', p0:0, p1:0},
    {t0:5.0, no:'STEP 2', tx:'地下連絡通路を通って<br>市民会館の方へ', sub:'市民会館へつながる地下連絡通路があります', p0:0, p1:0.467},
    {t0:7.6, no:'STEP 3', tx:'北へ進むと<br>名古屋市音楽プラザ', sub:'⑥出口から徒歩約3分', p0:0.467, p1:1},
    {t0:10.2,no:'GOAL',   tx:'1階 音楽サロン', sub:'どなた様も出入り自由です', p0:1, p1:1}
  ];
  var END = 14.0;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}

  window.seek = function(t){
    var title=document.getElementById('title');
    title.style.opacity = t<2.2 ? 1 : clamp(1-(t-2.2)/0.4,0,1);
    title.style.display = t<2.65 ? 'flex' : 'none';

    var show = clamp((t-2.4)/0.5,0,1);
    document.getElementById('hdr').style.opacity = show;
    document.getElementById('mapwrap').style.opacity = show;

    var cur=STEPS[0], idx=0;
    for (var i=0;i<STEPS.length;i++){ if(t>=STEPS[i].t0){cur=STEPS[i]; idx=i;} }
    var next = STEPS[idx+1];
    var span = (next? next.t0 : END) - cur.t0;
    var local = clamp((t-cur.t0)/Math.max(span-0.6,0.1),0,1);
    var p = cur.p0 + (cur.p1-cur.p0)*ease(local);

    reveal.style.strokeDashoffset = L*(1-p);
    arrow.style.opacity = p>=0.999 ? 1 : 0;

    // 女の子を経路上で歩かせる（上下に小さく弾ませる）
    var pt = route.getPointAtLength(route.getTotalLength()*p);
    var moving = (p>cur.p0+0.001 && p<cur.p1-0.001);
    var bob = moving ? Math.abs(Math.sin(t*7))*3.2 : 0;
    var s = 1.25;
    walker.setAttribute('transform','translate('+(pt.x-20*s)+' '+(pt.y-56*s-bob)+') scale('+s+')');

    document.getElementById('capno').innerHTML  = cur.no;
    document.getElementById('captx').innerHTML  = cur.tx;
    document.getElementById('capsub').innerHTML = cur.sub;
    document.getElementById('cap').style.opacity = show*clamp((t-cur.t0)/0.35,0,1);

    var ex = document.querySelector('.map .exit circle');
    var pulse = (t>=2.6 && t<5.0) ? 1+0.12*Math.sin((t-2.6)*6) : 1;
    ex.style.transform = 'scale('+pulse+')';
    ex.style.stroke = (t>=2.6 && t<5.0) ? 'var(--rose-d)' : 'currentColor';

    document.getElementById('foot').style.opacity = clamp((t-10.6)/0.6,0,1);
  };
  window.VIDEO_END = END;
  window.seek(0);
})();
</script>
