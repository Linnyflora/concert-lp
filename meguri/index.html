<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おみかんちゃん 1分体操アプリ</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff6f8;
  }

  .flyer {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
  }
  .flyer img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* QRコード以外の部分を覆うリンク。QRコードは長押しで読み取れるよう画像のまま残す */
  .flyer a {
    position: absolute;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .flyer .top    { left: 0;   top: 0;     width: 100%; height: 66%; }
  .flyer .bottom { left: 0;   top: 87.7%; width: 100%; height: 12.3%; }
  .flyer .left   { left: 0;   top: 66%;   width: 39%;  height: 21.7%; }
  .flyer .right  { left: 65%; top: 66%;   width: 35%;  height: 21.7%; }
</style>
</head>
<body>
<div class="flyer">
  <img src="flyer.jpg" width="729" height="1101" alt="巡りの法則 チラシ（タップでおみかんちゃん1分体操アプリのダウンロードページへ）">
  <a class="store top" href="https://apps.apple.com/jp/app/id6801839026" target="_blank" rel="noopener" aria-label="おみかんちゃん1分体操アプリをダウンロード"></a>
  <a class="store bottom" href="https://apps.apple.com/jp/app/id6801839026" target="_blank" rel="noopener" aria-hidden="true" tabindex="-1"></a>
  <a class="store left" href="https://apps.apple.com/jp/app/id6801839026" target="_blank" rel="noopener" aria-hidden="true" tabindex="-1"></a>
  <a class="store right" href="https://apps.apple.com/jp/app/id6801839026" target="_blank" rel="noopener" aria-hidden="true" tabindex="-1"></a>
</div>

<script>
  // AndroidならGoogle Playへ。それ以外(iPhoneなど)はApp Storeのまま
  if (/Android/.test(navigator.userAgent)) {
    document.querySelectorAll('.store').forEach(function (a) {
      a.href = 'https://play.google.com/store/apps/details?id=com.ayumiwatanabe.meguri';
    });
  }
</script>
</body>
</html>
