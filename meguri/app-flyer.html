<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1240px;height:1754px;font-family:"IPAPGothic","IPAGothic",sans-serif;color:#5a2a3c;
background:radial-gradient(circle at 15% 8%,#fff 0,transparent 30%),linear-gradient(165deg,#fff3f6 0%,#ffe1ea 50%,#ffe9d4 100%);
padding:60px 70px;text-align:center;position:relative;overflow:hidden}
.e{font-family:"Noto Color Emoji"}
.ribbon{display:inline-block;background:#e0457b;color:#fff;font-size:40px;font-weight:bold;padding:12px 56px;border-radius:999px;letter-spacing:.08em}
.catch{font-size:46px;font-weight:bold;margin:30px 0 4px}
.catch b{color:#e0457b;font-size:64px}
h1{font-size:104px;line-height:1.15;color:#e0457b;letter-spacing:.02em;
  text-shadow:4px 4px 0 #fff,-4px -4px 0 #fff,4px -4px 0 #fff,-4px 4px 0 #fff}
h1 small{display:block;font-size:56px;color:#f08a24;margin-top:8px}
.hero{display:flex;align-items:center;justify-content:center;gap:40px;margin:22px 0 24px}
.chara{width:400px;height:400px;overflow:hidden;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 36px rgba(224,69,123,.22),0 0 0 12px #ffd2df}
.chara img{width:330px;height:330px;margin-top:20px}
.points{text-align:left;display:flex;flex-direction:column;gap:20px}
.points div{background:#fff;border-radius:999px;padding:16px 34px;font-size:38px;font-weight:bold;box-shadow:0 4px 14px rgba(224,69,123,.15)}
.points div span{color:#e0457b}
.book{display:flex;align-items:center;gap:36px;background:#fff;border-radius:32px;padding:24px 40px;text-align:left;
  box-shadow:0 8px 26px rgba(224,69,123,.15);margin-top:22px}
.cover{width:230px;flex:none}
.cover img{width:100%;height:auto;display:block;border:1px solid #eee;box-shadow:4px 6px 14px rgba(90,42,60,.25)}
.amz{margin-left:auto;flex:none;text-align:center}
.amz img{width:190px;height:190px;display:block}
.amz p{font-size:26px;font-weight:bold;background:#232f3e;color:#fff;border-radius:999px;padding:4px 0;margin-top:8px}
.book .tag{display:inline-block;background:#f08a24;color:#fff;font-size:28px;font-weight:bold;padding:6px 22px;border-radius:999px;margin-bottom:12px}
.book .title{font-size:46px;font-weight:bold;line-height:1.3}
.book .by{font-size:32px;margin-top:10px}
.qrs{display:flex;gap:40px;justify-content:center}
.q{background:#fff;border-radius:32px;padding:22px 26px 20px;width:520px;box-shadow:0 8px 26px rgba(224,69,123,.18)}
.lab{font-size:38px;font-weight:bold;color:#fff;border-radius:999px;padding:8px 0;margin-bottom:14px}
.ios .lab{background:#3a3a3c}.and .lab{background:#2e9e5b}
.q img{width:280px;height:280px;display:block;margin:0 auto}
.store{font-size:28px;margin-top:6px}
.foot{margin-top:14px;font-size:34px;font-weight:bold}
.foot b{color:#e0457b}
.sp{position:absolute;color:#f5c542;font-size:54px}
</style></head><body>
<span class="sp" style="top:300px;left:60px">✦</span><span class="sp" style="top:250px;right:80px;font-size:40px">✦</span>
<span class="sp" style="top:820px;right:60px">✦</span><span class="sp" style="top:640px;left:40px;font-size:38px">✦</span>
<div class="ribbon">アプリ ダウンロード無料</div>
<p class="catch">たった<b>1分</b>で、心も体も</p>
<h1>巡りリセット！<small><span class="e">🍊</span>おみかんちゃん 1分体操アプリ<span class="e">🍊</span></small></h1>
<div class="hero">
  <div class="chara"><img src="omikan.png"></div>
  <div class="points">
    <div><span>✔</span> 1分だからつづけやすい</div>
    <div><span>✔</span> おみかんちゃんと一緒に</div>
    <div><span>✔</span> いつでもどこでも</div>
  </div>
</div>
<div class="qrs">
  <div class="q ios"><div class="lab">iPhone の方</div><img src="qr_ios.png"><div class="store">App Store</div></div>
  <div class="q and"><div class="lab">Android の方</div><img src="qr_android.png"><div class="store">Google Play</div></div>
</div>
<p class="foot">QRコードを読み取って<b>今すぐダウンロード！</b></p>
<div class="book">
  <div class="cover"><img src="book.jpg" alt="体も心も若返る1分体操 表紙"></div>
  <div>
    <span class="tag">このアプリの元になった本</span>
    <p class="title">『体も心も若返る<br>1分体操』</p>
    <p class="by">渡邉有優美 著（秀和システム）</p>
    <p class="by" style="color:#e0457b;font-weight:bold;margin-top:14px">1日1分、人生が変わる！</p>
  </div>
  <div class="amz"><img src="qr_amazon.png" alt="Amazonの商品ページ"><p>Amazonで見る</p></div>
</div>
</body></html>
